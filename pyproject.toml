[project]
name = "signals"
version = "0.1.0"
description = "Road traffic signs e-commerce"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "django-environ>=0.11",
    "Pillow>=11.0",
    "WeasyPrint>=62.0",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "stripe>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ipython>=8.0",
    "django-debug-toolbar>=4.4",
    "factory-boy>=3.3.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "signals.settings.dev"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
