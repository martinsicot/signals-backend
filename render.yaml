services:
  - type: web
    name: signals
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DJANGO_ALLOWED_HOSTS
        value: ""  # leave blank — RENDER_EXTERNAL_HOSTNAME is picked up automatically
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: signals-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379  # placeholder — Celery tasks will fail silently until Redis is added
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: noreply@signals.fr
      - key: STRIPE_PUBLIC_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: SHIPPING_FREE_THRESHOLD
        value: "200.00"
      - key: SHIPPING_FEE
        value: "9.90"

databases:
  - name: signals-db
    databaseName: signals
    user: signals
    plan: free
